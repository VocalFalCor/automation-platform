cat: "github/workflows/ci.yml" 

import: uuid 
from: contextlib 
import: asynccontextmanager 
from: fastapi 
import: FastAPI, HTTPException 
from: pydantic 
import: BaseModel
from: db 
import: get_conn
from: runs 
import: init_runs
from: runs 
import: router as runs_router
from: workflows
import: init_workflows
from: workflows
import: router as workflows_router


name: CI

on:
  push: 
  git: rm --cached main.py.bak n y
  rm: main.py.bak n y
  git: add -A
  git: commit -m "Move to PostgreSQL"
  git: push --set-upstream origin main
    
  pull_request:


  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: messages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messages"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/messages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t automation-platform.

   EOF: "Concurrency" 
