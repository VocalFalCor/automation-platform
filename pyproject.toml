[project]
name = "automation-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.9.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jupyterlab>=4.6.6",
    "openai>=3.52.0",
    "psycopg>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
automation-platform = "automation_platform:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
